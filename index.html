<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMD Server Panel</title>

<style>
body{
    margin:0;
    background:#121212;
    color:white;
    font-family:sans-serif;
}

header{
    background:#1f1f1f;
    padding:20px;
    font-size:28px;
    text-align:center;
    font-weight:bold;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1d1d1d;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.status{
    color:#00ff66;
    font-weight:bold;
}

button{
    width:100%;
    margin-top:10px;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

.start{
    background:#00c853;
    color:white;
}

.stop{
    background:#d50000;
    color:white;
}

.restart{
    background:#ff9800;
    color:white;
}

.console{
    background:black;
    color:#00ff00;
    padding:10px;
    height:200px;
    overflow:auto;
    font-family:monospace;
}

.player{
    background:#2b2b2b;
    padding:10px;
    border-radius:8px;
    margin:5px 0;
}
</style>

</head>

<body>

<header>
🎮 CMD Server Panel
</header>

<div class="container">

<div class="card">
<h2>サーバー状態</h2>

<p>状態：<span class="status">🟢 ONLINE</span></p>
<p>TPS：20.0</p>
<p>CPU：15%</p>
<p>メモリ：1.2GB / 4GB</p>
</div>

<div class="card">
<h2>操作</h2>

<button class="start" onclick="log('サーバーを起動しました')">
▶ 起動
</button>

<button class="stop" onclick="log('サーバーを停止しました')">
■ 停止
</button>

<button class="restart" onclick="log('サーバーを再起動しました')">
↻ 再起動
</button>

</div>

<div class="card">
<h2>オンラインプレイヤー</h2>

<div class="player">Commander129</div>
<div class="player">Steve</div>
<div class="player">Alex</div>

</div>

<div class="card">
<h2>コンソール</h2>

<div class="console" id="console">
CMD Server Panel 起動完了...
</div>

</div>

</div>

<script>

function log(text){

document.getElementById("console").innerHTML +=
"<br>> "+text;

}

</script>

</body>
</html>
